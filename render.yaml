services:
  - type: web
    name: ev-queue-ml
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 1 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: REQUIRE_MAPS_API_KEY
        value: "true"
      - key: BOOTSTRAP_SIMULATION
        value: "false"
      - key: DEBUG
        value: "false"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
